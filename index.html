<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jumping Mad Jump Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #e0f7fa; 
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: 'DotGothic16', sans-serif;
  }
  canvas {
    display: block; width: 100%; height: 100%;
  }
  
  #uiLayer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; 
    display: none; 
  }
  
  #scoreBoard {
    position: absolute; top: 20px; left: 20px;
    font-size: 20px; color: #333;
    background: rgba(240, 240, 240, 0.75); 
    padding: 10px 15px; border-radius: 10px;
    border: 2px solid rgba(51, 51, 51, 0.8);
    pointer-events: auto;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
    white-space: nowrap;
    min-width: 170px;
  }
  
  #pauseBtn {
    position: absolute; top: 20px; right: 20px;
    width: 60px; height: 60px;
    background: rgba(240, 240, 240, 0.75); 
    border: 2px solid rgba(51, 51, 51, 0.8);
    border-radius: 10px;
    pointer-events: auto;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    cursor: pointer;
    color: #333;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
  }
  #pauseBtn:active {
    background: rgba(220, 220, 220, 0.9);
    transform: translate(2px, 2px);
    box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
  }
  .pause-text {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .pause-icon {
    font-size: 24px;
    line-height: 1;
    margin-top: 2px;
  }

  #testModeUI {
    position: absolute;
    top: 110px;
    right: 20px;
    color: red;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
    display: none;
    z-index: 50;
  }

  #messageBanner {
    position: absolute;
    top: 35%; 
    transform: translateY(-50%);
    left: 0;
    width: 100%;
    background: rgba(50, 50, 50, 0.9); 
    color: white;
    text-align: center;
    padding: 20px 10px;
    box-sizing: border-box;
    font-size: 18px; 
    opacity: 0;
    pointer-events: none;
    line-height: 1.6;
    border-top: 3px solid rgba(255, 255, 255, 0.6);
    border-bottom: 3px solid rgba(255, 255, 255, 0.6);
  }

  #achievementBanner {
    position: absolute;
    top: 15%; 
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ffd700, #ff8c00); 
    color: #fff;
    padding: 15px 30px;
    border-radius: 10px;
    border: 4px solid #fff;
    text-align: center;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease-in-out;
    z-index: 100;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    text-shadow: 1px 1px 2px #000;
    width: 80%;
    max-width: 400px;
  }

  .modal-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    z-index: 20;
  }
  .menu-box {
    background: rgba(224, 247, 250, 0.9); 
    border: 4px solid rgba(51, 51, 51, 0.9);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    width: 85%;
    max-width: 320px;
    color: #333;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
  }
  .menu-tile {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px 0;
    font-size: 18px;
    background: rgba(255, 255, 255, 0.85);
    border: 4px solid rgba(51, 51, 51, 0.9);
    color: #333;
    cursor: pointer;
    font-family: 'DotGothic16', sans-serif;
    font-weight: bold;
    border-radius: 5px;
    box-shadow: 2px 2px 0px rgba(0,0,0,0.3);
  }
  .menu-tile:active {
    transform: translate(2px, 2px);
    box-shadow: 0px 0px 0px rgba(0,0,0,0.3);
  }
  .confirm-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
  .confirm-taunt { font-size: 22px; color: #d32f2f; margin-bottom: 20px; font-weight: bold; line-height: 1.4;}
  .confirm-note { font-size: 13px; color: #555; margin-top: 15px; text-align: left;}
  .confirm-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .confirm-buttons .menu-tile {
    margin: 0;
    flex: 1;
  }

  input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      margin-top: 10px;
  }
  input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #2196f3;
      cursor: pointer;
      margin-top: -8px; 
      border: 2px solid #333;
  }
  input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #ccc;
      border-radius: 3px;
      border: 1px solid #333;
  }

  #startScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8); display: flex; flex-direction: column;
    justify-content: center; align-items: center; color: white;
    pointer-events: auto; z-index: 30;
  }
  h1 { font-size: 32px; margin-bottom: 10px; color: #4fc3f7; text-shadow: 3px 3px 0 #000; text-align: center; line-height: 1.2;}
  p { font-size: 16px; margin-bottom: 30px; text-align: center; line-height: 1.8; }
  button.start-btn {
    padding: 15px 40px; font-size: 20px; 
    background: #4caf50; color: white; border: 4px solid #fff;
    border-radius: 0px; cursor: pointer;
    font-family: 'DotGothic16', sans-serif;
    box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
  }
  button.start-btn:active { 
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0px rgba(0,0,0,0.5);
  }

  #fadeOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: black;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 1s ease-in-out;
  }
</style>
</head>
<body>

<div id="uiLayer">
  <div id="scoreBoard">
    現在: <span id="currentAlt">0</span> m<br>
    <span style="font-size:16px;">最高: <span id="maxAlt">0</span> m</span><br>
    <span style="font-size:16px;">ﾀｲﾑ: <span id="timeDisp">00:00:00.00</span></span><br>
    <span style="font-size:16px; color:#b8860b; font-weight:bold;">💰 <span id="coinDisp">0</span></span>
  </div>
  <div id="pauseBtn">
    <div class="pause-text">ポーズ</div>
    <div class="pause-icon">⏸</div>
  </div>
  <div id="testModeUI">テストプレイ中</div>
  <div id="messageBanner"></div>
  <div id="achievementBanner"></div>
</div>

<div id="pauseMenu" class="modal-overlay" style="display: none;">
  <div class="menu-box">
    <div id="pauseMain">
      <div style="font-size:24px; margin-bottom: 20px; font-weight:bold;">一時停止</div>
      <button id="resumeBtn" class="menu-tile">ゲーム再開</button>
      <button id="settingsBtn" class="menu-tile">設定</button>
      <button id="toTitleBtn" class="menu-tile">タイトルへ戻る</button>
    </div>
    
    <div id="pauseSettings" style="display: none;">
      <div class="confirm-title">設定</div>
      <div style="margin-bottom:15px; text-align:left; font-size:16px; font-weight:bold;">
          BGM 音量: <span id="bgmValDisp">100</span><br>
          <input type="range" id="bgmSlider" min="0" max="100" value="100">
      </div>
      <div style="margin-bottom:20px; text-align:left; font-size:16px; font-weight:bold;">
          SE 音量: <span id="seValDisp">100</span><br>
          <input type="range" id="seSlider" min="0" max="100" value="100">
      </div>
      <button id="closeSettingsBtn" class="menu-tile">戻る</button>
    </div>

    <div id="pauseConfirm" style="display: none;">
      <div class="confirm-title">タイトルに戻りますか？</div>
      <div class="confirm-taunt">今の君には、<br>この足場を登るのは<br>無理かな?</div>
      <div class="confirm-buttons">
        <button id="confirmYesBtn" class="menu-tile">はい</button>
        <button id="confirmNoBtn" class="menu-tile">いいえ</button>
      </div>
      <div class="confirm-note">※タイトルへ戻ると現在のスコアと足場のデータはすべて失われます。</div>
    </div>
  </div>
</div>

<div id="startScreen">
  <h1 id="titleText">Jumping Mad<br>Jump Machine</h1>
  <p>
    📱 傾きで移動 / 👆 画面長押しでジャンプ<br>
    ※1秒間に2回タップでジャイロの基準位置リセット<br>
    頭を打つと操作が反転＆溜めができなくなります。
  </p>
  <button id="startBtn" class="start-btn">スタート</button>
</div>

<div id="fadeOverlay"></div>

<canvas id="gameCanvas"></canvas>

<script>
  const IS_TEST_MODE = false; 

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const currentAltElement = document.getElementById('currentAlt');
  const maxAltElement = document.getElementById('maxAlt');
  const timeDisp = document.getElementById('timeDisp'); 
  const coinDisp = document.getElementById('coinDisp'); 
  const messageBanner = document.getElementById('messageBanner');
  const achievementBanner = document.getElementById('achievementBanner');
  const testModeUI = document.getElementById('testModeUI');
  const fadeOverlay = document.getElementById('fadeOverlay');
  
  const uiLayer = document.getElementById('uiLayer');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseMenu = document.getElementById('pauseMenu');
  const pauseMain = document.getElementById('pauseMain');
  const pauseSettings = document.getElementById('pauseSettings');
  const pauseConfirm = document.getElementById('pauseConfirm');
  
  const resumeBtn = document.getElementById('resumeBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const toTitleBtn = document.getElementById('toTitleBtn');
  const confirmYesBtn = document.getElementById('confirmYesBtn');
  const confirmNoBtn = document.getElementById('confirmNoBtn');

  const bgmSlider = document.getElementById('bgmSlider');
  const seSlider = document.getElementById('seSlider');
  const bgmValDisp = document.getElementById('bgmValDisp');
  const seValDisp = document.getElementById('seValDisp');

  let width = window.innerWidth;
  let height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const STAGE_EXPAND = 64;
  const LIMIT_LEFT = -STAGE_EXPAND;
  const LIMIT_RIGHT = width + STAGE_EXPAND;

  let startGroundY = 0;
  let startZeroAltY = 0;

  let isPlaying = false;
  let isPaused = false;
  let pauseTimeStart = 0; 

  let timerRunning = false;
  let elapsedMs = 0;
  let lastFrameTime = 0;

  let tilt = 0; 
  let tiltY = 0; 
  
  let isPressing = false;       
  let isPointerDown = false;    
  let pressStartTime = 0;
  let lastReleaseTime = 0; 

  let tapTimes = [];
  let isPendingCalibration = false;
  let calibrationHoldStartTime = 0;
  let isCalibrating = false;
  let lastCalibrationSoundTime = 0;
  
  let systemMessage = "";
  let systemMessageEndTime = 0;
  let achTimer = null; 

  let cameraY = 0;
  let cameraX = 0; 
  let maxAltitude = 0; 
  let bestScore = 0;   
  let totalCoins = 0;  
  let floatingTexts = []; 

  let achievements = { story: false, extra: false, final: false };
  let sessionFlags = { story: false, extra: false, final: false };
  let unlockedSkins = [];

  let hitStopEndTime = 0;
  let nextSafetyLevel = 1; 

  let bigFallStartTime = 0;
  let currentBigFallMessage = "";
  
  let bgmVolume = 1.0; 
  let seVolume = 1.0;  
  
  const BGM_DIR = 'audio/bgm/';
  const bgmTitle = new Audio(BGM_DIR + 'タイトル.mp3');
  bgmTitle.loop = true;
  const bgmGame = new Audio(BGM_DIR + '地上付近.mp3');
  bgmGame.loop = true;

  let currentBgm = null;
  let bgmFadeInterval = null;
  
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx;

  let clouds = [];
  const PARALLAX_FACTOR_CLOUD = 0.15; 

  function pRand(s) {
      let h = Math.sin(s) * 43758.5453123;
      return h - Math.floor(h);
  }

  function getBaseTowerColor(altMeters) {
      let clampedAlt = Math.max(0, Math.min(8000, altMeters));
      let step = Math.floor(clampedAlt / 1000); 
      let ratio = step / 8; 
      let r = Math.floor(180 - 80 * ratio); 
      let g = Math.floor(180 - 80 * ratio);
      let b = Math.floor(180 - 78 * ratio); 
      return {r: r, g: g, b: b};
  }

  function getCylinderColorRGB(baseColor, x, blockW, towerLeft, towerRight) {
      let center = (towerLeft + towerRight) / 2;
      let blockCenter = x + blockW / 2;
      blockCenter = Math.max(towerLeft, Math.min(towerRight, blockCenter));
      let dist = Math.abs(blockCenter - center);
      let maxDist = (towerRight - towerLeft) / 2;
      
      let factor = 1.0 - Math.pow(dist / maxDist, 2.0) * 0.5; 
      
      let r = Math.floor(baseColor.r * factor);
      let g = Math.floor(baseColor.g * factor);
      let b = Math.floor(baseColor.b * factor);
      return {r: r, g: g, b: b};
  }

  function saveData() {
      localStorage.setItem('jm_totalCoins', totalCoins);
      localStorage.setItem('jm_bestScore', bestScore);
      localStorage.setItem('jm_achievements', JSON.stringify(achievements));
      localStorage.setItem('jm_unlockedSkins', JSON.stringify(unlockedSkins));
  }
  function loadData() {
      let savedCoins = localStorage.getItem('jm_totalCoins');
      if (savedCoins) totalCoins = parseInt(savedCoins);
      let savedScore = localStorage.getItem('jm_bestScore');
      if (savedScore) bestScore = parseInt(savedScore);
      let savedAch = localStorage.getItem('jm_achievements');
      if (savedAch) achievements = JSON.parse(savedAch);
      let savedSkins = localStorage.getItem('jm_unlockedSkins');
      if (savedSkins) unlockedSkins = JSON.parse(savedSkins);

      coinDisp.innerText = totalCoins;
      maxAltElement.innerText = bestScore;
  }
  loadData(); 

  function addFloatingText(x, y, text, color) {
      floatingTexts.push({x: x, y: y, text: text, color: color, life: 60, maxLife: 60});
  }

  function showAchievement(title, desc) {
      achievementBanner.innerHTML = `<div style="font-size:22px;margin-bottom:8px;">${title}</div><div style="font-size:16px;">${desc.replace(/\n/g, '<br>')}</div>`;
      achievementBanner.style.opacity = '1';
      
      playOscillator('triangle', 400, 800, 0.2, 0.6);
      setTimeout(() => playOscillator('triangle', 600, 1200, 0.2, 0.6), 200);
      setTimeout(() => playOscillator('sine', 800, 1600, 0.4, 0.6), 400);

      if(achTimer) clearTimeout(achTimer);
      achTimer = setTimeout(() => {
          achievementBanner.style.opacity = '0';
      }, 5000);
  }

  function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playOscillator(type, startFreq, endFreq, duration, vol) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      if (endFreq !== null) {
          osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol * seVolume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
  }

  function playNoise(duration, vol) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(vol * seVolume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1000;
      
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
  }

  function playSePurupuru() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const startTime = audioCtx.currentTime;
      const duration = 0.15; 

      const osc = audioCtx.createOscillator();
      const mainGain = audioCtx.createGain();

      osc.type = 'sine'; 
      osc.frequency.setValueAtTime(400, startTime);
      osc.frequency.exponentialRampToValueAtTime(600, startTime + duration);

      mainGain.gain.setValueAtTime(0, startTime);
      mainGain.gain.linearRampToValueAtTime(0.4 * seVolume, startTime + 0.03);
      mainGain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

      osc.connect(mainGain);
      mainGain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration);
  }

  function createSlimeBloop(startFreq, endFreq, duration) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const startTime = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine'; 
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.setValueAtTime(startFreq, startTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + duration);

      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.5 * seVolume, startTime + duration * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);

      osc.start(startTime);
      osc.stop(startTime + duration);
  }

  function createSlimeLand() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const startTime = audioCtx.currentTime;
      
      const thudOsc = audioCtx.createOscillator();
      const thudGain = audioCtx.createGain();
      thudOsc.type = 'triangle';
      
      thudOsc.connect(thudGain);
      thudGain.connect(audioCtx.destination);
      
      thudOsc.frequency.setValueAtTime(150, startTime);
      thudOsc.frequency.exponentialRampToValueAtTime(30, startTime + 0.15); 
      
      thudGain.gain.setValueAtTime(0, startTime);
      thudGain.gain.linearRampToValueAtTime(0.6 * seVolume, startTime + 0.02); 
      thudGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
      
      thudOsc.start(startTime);
      thudOsc.stop(startTime + 0.15);

      const splashOsc = audioCtx.createOscillator();
      const splashGain = audioCtx.createGain();
      splashOsc.type = 'sine';
      
      splashOsc.connect(splashGain);
      splashGain.connect(audioCtx.destination);
      
      splashOsc.frequency.setValueAtTime(800, startTime);
      splashOsc.frequency.exponentialRampToValueAtTime(200, startTime + 0.1); 
      
      splashGain.gain.setValueAtTime(0, startTime);
      splashGain.gain.linearRampToValueAtTime(0.4 * seVolume, startTime + 0.02);
      splashGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.1);
      
      splashOsc.start(startTime);
      splashOsc.stop(startTime + 0.1);
  }

  function playSeHitLight() { 
      playNoise(0.1, 0.4); 
      playOscillator('square', 100, 50, 0.1, 0.2); 
      createSlimeLand(); 
  }
  
  function playSeHitHeavy() { 
      playNoise(0.3, 0.7); 
      playOscillator('sine', 80, 20, 0.3, 0.6); 
      createSlimeLand(); 
  }
  
  function playSeFall() { playOscillator('sine', 800, 100, 1.2, 0.5); }
  function playSeCrash() { playNoise(0.5, 0.9); playOscillator('sine', 50, 10, 0.5, 0.8); }
  function playSeClimb() { playOscillator('sawtooth', 300, 600, 0.15, 0.3); }
  function playSeJump() { createSlimeBloop(400, 800, 0.2); }
  function playSeCharge() { playOscillator('triangle', 200, 400, 0.1, 0.7); }
  
  function playSeChestOpen(type) {
      if (type === 'diamond' || type === 'gold') {
          playOscillator('sine', 800, 1600, 0.1, 0.5);
          setTimeout(() => playOscillator('sine', 1000, 2000, 0.15, 0.5), 100);
      } else {
          playOscillator('sine', 800, 1200, 0.1, 0.5);
      }
  }

  function fadeInBgm(targetBgm, durationMs) {
      if (currentBgm && currentBgm !== targetBgm) {
          currentBgm.pause();
          currentBgm.currentTime = 0;
      }
      currentBgm = targetBgm;
      currentBgm.volume = 0;
      currentBgm.play().catch(e => console.log("BGM再生不可:", e));

      const steps = 20;
      const stepTime = durationMs / steps;
      let step = 0;

      if (bgmFadeInterval) clearInterval(bgmFadeInterval);
      bgmFadeInterval = setInterval(() => {
          step++;
          let vol = bgmVolume * (step / steps);
          if (vol > 1) vol = 1;
          if (currentBgm) currentBgm.volume = vol;
          if (step >= steps) clearInterval(bgmFadeInterval);
      }, stepTime);
  }

  function fadeOutBgm(durationMs, callback) {
      if (!currentBgm) {
          if(callback) callback();
          return;
      }
      const startVol = currentBgm.volume;
      const steps = 20;
      const stepTime = durationMs / steps;
      let step = 0;

      if (bgmFadeInterval) clearInterval(bgmFadeInterval);
      bgmFadeInterval = setInterval(() => {
          step++;
          let vol = startVol * (1 - (step / steps));
          if (vol < 0) vol = 0;
          if (currentBgm) currentBgm.volume = vol;
          if (step >= steps) {
              clearInterval(bgmFadeInterval);
              if (currentBgm) {
                  currentBgm.pause();
                  currentBgm.currentTime = 0;
              }
              currentBgm = null;
              if (callback) callback();
          }
      }, stepTime);
  }

  let baseQuat = [1, 0, 0, 0];

  function eulerToQuat(alpha, beta, gamma) {
      const deg2rad = Math.PI / 180;
      const a = (alpha || 0) * deg2rad / 2;
      const b = (beta || 0) * deg2rad / 2;
      const c = (gamma || 0) * deg2rad / 2;

      const ca = Math.cos(a), sa = Math.sin(a);
      const cb = Math.cos(b), sb = Math.sin(b);
      const cc = Math.cos(c), sc = Math.sin(c);

      const w = ca * cb * cc - sa * sb * sc;
      const x = ca * sb * cc - sa * cb * sc;
      const y = ca * cb * sc + sa * sb * cc;
      const z = sa * cb * cc + ca * sb * sc;

      return [w, x, y, z];
  }

  function multiplyQuat(q1, q2) {
      return [
          q1[0]*q2[0] - q1[1]*q2[1] - q1[2]*q2[2] - q1[3]*q2[3],
          q1[0]*q2[1] + q1[1]*q2[0] + q1[2]*q2[3] - q1[3]*q2[2],
          q1[0]*q2[2] - q1[1]*q2[3] + q1[2]*q2[0] + q1[3]*q2[1],
          q1[0]*q2[3] + q1[1]*q2[2] - q1[2]*q2[1] + q1[3]*q2[0]
      ];
  }

  function invertQuat(q) {
      return [q[0], -q[1], -q[2], -q[3]];
  }

  function getRelEuler(q) {
      const w = q[0], x = q[1], y = q[2], z = q[3];
      let sinb = 2 * (y*z + w*x);
      sinb = Math.max(-1, Math.min(1, sinb));
      let beta = Math.asin(sinb);
      let gamma = Math.atan2(-(2 * (x*z - w*y)), 1 - 2 * (x*x + y*y));

      const rad2deg = 180 / Math.PI;
      return { beta: beta * rad2deg, gamma: gamma * rad2deg };
  }

  function drawPlatformLayer(ctx, p, endY, yOffset, thickness, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y + yOffset);
      ctx.lineTo(p.x + p.w, endY + yOffset);
      ctx.lineTo(p.x + p.w, endY + yOffset + thickness);
      ctx.lineTo(p.x, p.y + yOffset + thickness);
      ctx.closePath();
      ctx.fill();
  }

  function renderTowerChunkToCache(idx) {
      let chunkBottomY = startZeroAltY - idx * CHUNK_HEIGHT_PX;
      let chunkTopY = chunkBottomY - CHUNK_HEIGHT_PX;
      
      let towerLeft = 48;
      let towerRight = width - 48;
      let towerWidth = towerRight - towerLeft;
      
      let blockH = 64;
      let blockW = 128;
      let startY = Math.floor(chunkTopY / blockH) * blockH;
      
      let canvas = document.createElement('canvas');
      canvas.width = towerWidth;
      
      let extraH = (idx === 0) ? (startGroundY - startZeroAltY) : 0;
      canvas.height = CHUNK_HEIGHT_PX + extraH;
      
      let ctx = canvas.getContext('2d');
      ctx.translate(-towerLeft, -chunkTopY);
      
      let drawBottom = chunkBottomY + extraH;
      
      ctx.lineWidth = 2;
      
      for (let y = startY; y < drawBottom; y += blockH) {
          let altMeters = Math.max(0, (startGroundY - y) / PIXELS_PER_METER);
          let baseColor = getBaseTowerColor(altMeters);
          
          let rowIdx = Math.floor(y / blockH);
          let offset = (rowIdx % 2 === 0) ? 0 : (blockW / 2);
          
          for (let x = towerLeft - blockW; x <= towerRight; x += blockW) {
              let bx = x + offset;
              if (bx > towerRight || bx + blockW < towerLeft) continue;
              
              let drawX = Math.max(towerLeft, bx);
              let drawW_block = Math.min(towerRight, bx + blockW) - drawX;
              
              let blockColorObj = getCylinderColorRGB(baseColor, drawX, drawW_block, towerLeft, towerRight);
              ctx.fillStyle = `rgb(${blockColorObj.r}, ${blockColorObj.g}, ${blockColorObj.b})`;
              ctx.fillRect(drawX, y, drawW_block, blockH);
              
              let seed = bx * 13.1 + y * 97.3;
              let altRatio = Math.max(0, Math.min(1, altMeters / 15000));
              
              let dirtProb = 0.8 * (1 - altRatio);
              if (pRand(seed) < dirtProb) {
                  let dirtR = Math.max(0, blockColorObj.r - 40);
                  let dirtG = Math.max(0, blockColorObj.g - 40);
                  let dirtB = Math.max(0, blockColorObj.b - 40);
                  ctx.fillStyle = `rgba(${dirtR}, ${dirtG}, ${dirtB}, 0.8)`;
                  
                  let spots = Math.floor(pRand(seed+1) * 5) + 2;
                  for (let s=0; s<spots; s++) {
                      let spotX = drawX + pRand(seed+2+s) * drawW_block;
                      let isEdgeY = pRand(seed+3+s) < 0.5;
                      let spotY = y + (pRand(seed+4+s) < 0.5 ? pRand(seed+5+s)*10 : blockH - pRand(seed+5+s)*10);
                      if (!isEdgeY) {
                          spotY = y + pRand(seed+6+s) * blockH;
                          spotX = drawX + (pRand(seed+7+s) < 0.5 ? pRand(seed+8+s)*10 : drawW_block - pRand(seed+8+s)*10);
                      }
                      
                      let shapeType = Math.floor(pRand(seed+9+s) * 3);
                      let sw = 4 + pRand(seed+10+s) * 12;
                      let sh = 4 + pRand(seed+11+s) * 12;
                      
                      if (spotX < towerLeft - 2) spotX = towerLeft - 2;
                      if (spotX + sw > towerRight + 2) sw = (towerRight + 2) - spotX;
                      
                      if (sw > 0) {
                          ctx.beginPath();
                          if (shapeType === 0) {
                              ctx.rect(spotX, spotY, sw, sh);
                          } else if (shapeType === 1) {
                              ctx.moveTo(spotX, spotY); ctx.lineTo(spotX + sw, spotY + sh); ctx.lineTo(spotX, spotY + sh);
                          } else {
                              ctx.moveTo(spotX + sw, spotY); ctx.lineTo(spotX + sw, spotY + sh); ctx.lineTo(spotX, spotY);
                          }
                          ctx.fill();
                      }
                  }
              }
              
              let mossProb = 0.1 + 0.7 * altRatio;
              if (pRand(seed+100) < mossProb) {
                  let isVine = pRand(seed+101) < 0.4;
                  if (!isVine) {
                      ctx.fillStyle = "rgba(45, 80, 40, 0.85)";
                      let mossCount = Math.floor(pRand(seed+102) * 6) + 3;
                      for(let i = 0; i < mossCount; i++) {
                          let mx = drawX + pRand(seed+103+i) * drawW_block;
                          let my = y + pRand(seed+104+i) * 20 - 5;
                          let mw = 3 + pRand(seed+105+i) * 6;
                          let mh = 3 + pRand(seed+106+i) * 6;
                          if (mx < towerLeft - 2) mx = towerLeft - 2;
                          if (mx + mw > towerRight + 2) mw = (towerRight + 2) - mx;
                          if (mw > 0) ctx.fillRect(mx, my, mw, mh);
                      }
                  } else {
                      ctx.fillStyle = "rgba(30, 60, 25, 0.9)";
                      let vineLen = Math.floor(pRand(seed+107) * 8) + 4;
                      let curX = drawX + pRand(seed+108) * drawW_block;
                      let curY = y;
                      for(let v = 0; v < vineLen; v++) {
                          if (curX >= towerLeft - 2 && curX <= towerRight + 2) {
                              ctx.fillRect(curX, curY, 3, 6);
                          }
                          curY += 5;
                          curX += (pRand(seed+109+v) - 0.5) * 8;
                          if (pRand(seed+110+v) < 0.7) {
                              let leafSize = 4 + pRand(seed+111+v) * 5;
                              let dir = pRand(seed+112+v) < 0.5 ? 1 : -1;
                              if (curX >= towerLeft - 2 && curX + (dir * leafSize) <= towerRight + 2 && curX + (dir * leafSize) >= towerLeft - 2) {
                                  ctx.beginPath();
                                  ctx.moveTo(curX, curY);
                                  ctx.lineTo(curX + dir * leafSize, curY - leafSize * 0.5);
                                  ctx.lineTo(curX + dir * leafSize * 0.4, curY + leafSize);
                                  ctx.fill();
                              }
                          }
                      }
                  }
              }
              
              ctx.strokeStyle = "rgba(0, 0, 0, 0.3)";
              ctx.beginPath();
              ctx.moveTo(drawX, y + blockH);
              ctx.lineTo(drawX + drawW_block, y + blockH);
              if (bx + blockW <= towerRight && bx + blockW >= towerLeft) {
                  ctx.moveTo(bx + blockW, y);
                  ctx.lineTo(bx + blockW, y + blockH);
              }
              ctx.stroke();
          }
      }
      return canvas;
  }

  function renderPlatformToCache(p) {
      let tan = p.slope ? Math.tan(p.slope * Math.PI / 180) : 0;
      let oL = p.offsetLeft || 0;
      let oR = p.offsetRight || 0;
      let minX, maxX, minY, maxY;
      
      if (p.isGround) {
          minX = -32;
          maxX = p.w + 32;
          minY = -60; 
          maxY = p.h + 20;
      } else {
          minX = Math.min(0, oL, p.w, p.w + oR) - 30;
          maxX = Math.max(0, oL, p.w, p.w + oR) + 30;
          minY = Math.min(0, p.w * tan) - 60; 
          maxY = Math.max(p.h, p.w * tan + p.h) + 30;
      }

      let cW = Math.ceil(maxX - minX);
      let cH = Math.ceil(maxY - minY);
      
      let canvas = document.createElement('canvas');
      canvas.width = cW;
      canvas.height = cH;
      let ctx = canvas.getContext('2d');
      
      ctx.translate(-minX, -minY);
      
      if (p.isGround) {
          let dp = {x: -16, y: 0, w: p.w + 32, h: p.h, slope: 0};
          let endY = dp.y;
          let darkGroundStr = '#3d2616'; 
          
          drawPlatformLayer(ctx, dp, endY, 10, dp.h - 10, darkGroundStr); 
          
          ctx.save();
          ctx.beginPath();
          ctx.rect(dp.x, dp.y + 10, dp.w, dp.h - 10);
          ctx.clip();
          
          let stoneCount = Math.floor(dp.h / 2);
          let stoneSeed = 888;
          for (let i = 0; i < stoneCount; i++) {
               let sx = dp.x + pRand(stoneSeed++) * dp.w;
               let sy = dp.y + 10 + pRand(stoneSeed++) * (dp.h - 10);
               let size = 6 + pRand(stoneSeed++) * 14; 
               let type = Math.floor(pRand(stoneSeed++) * 3);
               let isDark = pRand(stoneSeed++) < 0.5;
               
               ctx.fillStyle = isDark ? '#2b1a0f' : '#4f321c'; 
               ctx.beginPath();
               if (type === 0) { 
                   ctx.rect(sx, sy, size, size * (0.5 + pRand(stoneSeed++)));
               } else if (type === 1) { 
                   ctx.moveTo(sx, sy); ctx.lineTo(sx + size, sy + size); ctx.lineTo(sx, sy + size);
               } else {
                   ctx.moveTo(sx + size, sy); ctx.lineTo(sx + size, sy + size); ctx.lineTo(sx, sy);
               }
               ctx.fill();
          }
          ctx.restore();

          let surfaceBase = '#1b5e20'; 
          let surfaceTop = '#2e7d32';
          drawPlatformLayer(ctx, dp, endY, 0, 10, surfaceBase);  
          drawPlatformLayer(ctx, dp, endY, 0, 3, surfaceTop);   

          let weedSeedBase = Math.abs(Math.floor(p.x + p.y));
          drawWeeds(ctx, dp, weedSeedBase + 100, '#4caf50', 8, 12, 0);
          drawWeeds(ctx, dp, weedSeedBase + 200, surfaceTop, 6, 10, 1);
      } else {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(p.w, p.w * tan);
          ctx.lineTo(p.w + oR, p.w * tan + p.h);
          ctx.lineTo(oL, p.h);
          ctx.closePath();
          ctx.clip();
          
          let bH = 10;
          let altMeters = Math.max(0, (startZeroAltY - p.y) / PIXELS_PER_METER);
          let tColor = getBaseTowerColor(altMeters);
          
          let bR = Math.floor(tColor.r * 0.4);
          let bG = Math.floor(tColor.g * 0.4);
          let bB = Math.floor(tColor.b * 0.4);
          let cols = [
              `rgb(${bR}, ${bG}, ${bB})`,
              `rgb(${Math.max(0, bR-10)}, ${Math.max(0, bG-10)}, ${Math.max(0, bB-10)})`,
              `rgb(${Math.min(255, bR+10)}, ${Math.min(255, bG+10)}, ${Math.min(255, bB+10)})`,
              `rgb(${Math.max(0, bR-20)}, ${Math.max(0, bG-20)}, ${Math.max(0, bB-20)})`,
              `rgb(${Math.floor(bR*0.8)}, ${Math.floor(bG*0.8)}, ${Math.floor(bB*0.8)})`
          ];
          
          let seed = p.x * 1.3 + p.y * 2.7;
          let drawW = (Math.max(0, oL, p.w, p.w + oR) + 20) - (Math.min(0, oL, p.w, p.w + oR) - 20);
          let localMinX = Math.min(0, oL, p.w, p.w + oR) - 20;
          let localMinY = Math.min(0, p.w * tan) - 20;
          let localMaxY = Math.max(p.h, p.w * tan + p.h) + 20;
          
          let sideR = Math.floor(bR * 0.5);
          let sideG = Math.floor(bG * 0.5);
          let sideB = Math.floor(bB * 0.5);
          ctx.fillStyle = `rgb(${sideR}, ${sideG}, ${sideB})`;
          ctx.fillRect(localMinX, localMinY, drawW, localMaxY - localMinY);

          ctx.transform(1, tan, 0, 1, 0, 0);
          
          for (let y = 0; y < p.h; y += bH) {
              let x = localMinX;
              let rowSeed = seed + y * 11.1;
              while (x < (Math.max(0, oL, p.w, p.w + oR) + 20)) {
                  let s = rowSeed + x * 7.3;
                  let w = 12 + (pRand(s) * 16);
                  let colIdx = Math.floor(pRand(s + 1) * cols.length);
                  ctx.fillStyle = cols[colIdx];
                  ctx.fillRect(x + 1, y + 1, w - 2, bH - 2);
                  x += w;
              }
          }
          ctx.restore();
          
          if (p.isSafety) {
              ctx.save();
              ctx.rotate(tan ? Math.atan(tan) : 0);
              let parapetH = 24;
              let bW = 20;
              let pSeed = p.x * 5.1 + p.y * 3.3;
              
              for (let x = 0; x < p.w; x += bW) {
                  let s = pSeed + x * 2.9;
                  if (pRand(s) < 0.15) continue; 
                  
                  let isDent = pRand(s + 1) < 0.5; 
                  let currentH = isDent ? parapetH * 0.6 : parapetH;
                  let pDrawW = Math.min(bW, p.w - x);
                  
                  let blockH = 12;
                  for(let py = 0; py < currentH; py += blockH) {
                      let bh = Math.min(blockH, currentH - py);
                      let s2 = s + py * 1.7;
                      let colIdx = Math.floor(pRand(s2) * cols.length);
                      ctx.fillStyle = cols[colIdx];
                      
                      let drawY = -py - bh + 1;
                      ctx.fillRect(x + 1, drawY + 1, pDrawW - 2, bh - 2);
                      
                      ctx.strokeStyle = `rgba(${Math.floor(bR*0.4)}, ${Math.floor(bG*0.4)}, ${Math.floor(bB*0.4)}, 0.8)`;
                      ctx.lineWidth = 2;
                      ctx.strokeRect(x, drawY, pDrawW, bh);
                  }
              }
              ctx.restore();
          }
      }
      
      p.cachedCanvas = canvas;
      p.cacheMinX = minX;
      p.cacheMinY = minY;
  }

  function manageCaches(currentChunkIndex) {
      for (let idxStr in chunks) {
          let idx = parseInt(idxStr);
          if (idx < currentChunkIndex - 2 || idx > currentChunkIndex + 2) {
              let chunk = chunks[idx];
              for (let i = 0; i < chunk.length; i++) {
                  chunk[i].cachedCanvas = null; 
              }
          }
      }
      
      for (let idxStr in towerCaches) {
          let idx = parseInt(idxStr);
          if (idx < currentChunkIndex - 2 || idx > currentChunkIndex + 2) {
              delete towerCaches[idx];
          }
      }
  }

  function drawSlime(ctx, sw, sh, isCharging, tremble, bend = 0, tiltY = 0) {
      ctx.beginPath();
      let baseW = sw * 0.35; 
      let midW = sw * 0.65;
      let topY = -sh * 0.85;
      
      if (!isCharging) {
          if (tiltY < -20) {
              topY = -sh * 1.15;
              midW = sw * 0.55;
          } else if (tiltY < -5) {
              topY = -sh * 1.0;
              midW = sw * 0.60;
          } else if (tiltY > 20) {
              topY = -sh * 0.5;
              midW = sw * 0.75;
          } else if (tiltY > 5) {
              topY = -sh * 0.65;
              midW = sw * 0.70;
          }
      }
      
      let tx = (x, y) => x + bend * Math.pow(y / topY, 2) * sw * 0.5;
      let ty = (x, y) => y;

      if (isCharging) {
          let cTopY = -sh * 0.4 + tremble; 
          let sideY = -sh * 0.55 + tremble; 
          let cMidW = sw * 0.8 + tremble; 
          
          ctx.moveTo(tx(-baseW, 0), ty(-baseW, 0)); 
          ctx.bezierCurveTo(tx(-cMidW, 0), ty(-cMidW, 0), tx(-cMidW, sideY), ty(-cMidW, sideY), tx(-cMidW*0.5, sideY), ty(-cMidW*0.5, sideY));
          ctx.bezierCurveTo(tx(-cMidW*0.2, sideY), ty(-cMidW*0.2, sideY), tx(-cMidW*0.2, cTopY), ty(-cMidW*0.2, cTopY), tx(0, cTopY), ty(0, cTopY));
          ctx.bezierCurveTo(tx(cMidW*0.2, cTopY), ty(cMidW*0.2, cTopY), tx(cMidW*0.2, sideY), ty(cMidW*0.2, sideY), tx(cMidW*0.5, sideY), ty(cMidW*0.5, sideY));
          ctx.bezierCurveTo(tx(cMidW, sideY), ty(cMidW, sideY), tx(cMidW, 0), ty(cMidW, 0), tx(baseW, 0), ty(baseW, 0));
          ctx.quadraticCurveTo(tx(0, sh * 0.05), ty(0, sh * 0.05), tx(-baseW, 0), ty(-baseW, 0));
      } else {
          ctx.moveTo(tx(-baseW, 0), ty(-baseW, 0)); 
          ctx.bezierCurveTo(tx(-midW, 0), ty(-midW, 0), tx(-midW, topY), ty(-midW, topY), tx(0, topY), ty(0, topY));
          ctx.bezierCurveTo(tx(midW, topY), ty(midW, topY), tx(midW, 0), ty(midW, 0), tx(baseW, 0), ty(baseW, 0));
          ctx.quadraticCurveTo(tx(0, sh * 0.05), ty(0, sh * 0.05), tx(-baseW, 0), ty(-baseW, 0));
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
  }

  function drawTeardrop(ctx, r, frontStretch, backStretch, frontWidth, backWidth) {
      ctx.beginPath();
      ctx.moveTo(r * frontStretch, 0);
      ctx.bezierCurveTo(
          r * frontStretch, -frontWidth, 
          -r * backStretch * 0.2, -backWidth, 
          -r * backStretch, 0 
      );
      ctx.bezierCurveTo(
          -r * backStretch * 0.2, backWidth,
          r * frontStretch, frontWidth,
          r * frontStretch, 0
      );
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
  }

  function createCloudParts() {
      let parts = [];
      let numParts = 4 + Math.floor(Math.random() * 4);
      let cx = 0;
      for (let i = 0; i < numParts; i++) {
          let w = (50 + Math.random() * 80) * 0.66;
          let h = (30 + Math.random() * 40) * 0.66;
          let dy = (Math.random() - 0.5) * 30;
          let op = 0.2 + Math.random() * 0.7; 
          parts.push({x: cx, y: dy, w: w, h: h, op: op});
          cx += w * 0.6 + Math.random() * 20; 
      }
      return { parts: parts, w: cx }; 
  }

  function initClouds() {
      clouds = [];
      for (let i=0; i<15; i++) {
          clouds.push({
              x: Math.random() * width * 2 - width,
              y: Math.random() * height * 2 - height,
              speed: 0.1 + Math.random() * 0.3,
              data: createCloudParts()
          });
      }
  }

  function getChestType(altMeters) {
      let rand = Math.random() * 100;
      if (altMeters < 1000) {
          if (rand < 90) return 'copper';
          if (rand < 98) return 'silver';
          return 'gold'; 
      } else if (altMeters < 2500) {
          if (rand < 70) return 'copper';
          if (rand < 90) return 'silver';
          if (rand < 98) return 'gold';
          return 'diamond';
      } else if (altMeters < 4000) {
          if (rand < 50) return 'copper';
          if (rand < 80) return 'silver';
          if (rand < 95) return 'gold';
          return 'diamond';
      } else {
          if (rand < 40) return 'copper';
          if (rand < 70) return 'silver';
          if (rand < 90) return 'gold';
          return 'diamond';
      }
  }

  function openChest(type) {
      let rand = Math.random() * 100;
      if (type === 'copper') {
          if (rand < 80) return { coins: 10 };
          if (rand < 95) return { coins: 50 };
          if (rand < 99.5) return { coins: 200 };
          return { coins: 1000 };
      } else if (type === 'silver') {
          if (rand < 60) return { coins: 10 };
          if (rand < 85) return { coins: 50 };

          if (rand < 98.5) return { coins: 1000 };
          if (rand < 99.5) return { coins: 2000 };

      } else if (type === 'gold') {
          if (rand < 50) return { coins: 10 };
          if (rand < 80) return { coins: 50 };
          if (rand < 93) return { coins: 200 };
          if (rand < 98) return { coins: 1000 };
          if (rand < 99.5) return { coins: 2000 };
          return { coins: 0, skin: 'normal' };
      } else { 
          if (rand < 40) return { coins: 10 };
          if (rand < 70) return { coins: 50 };
          if (rand < 88) return { coins: 200 };
          if (rand < 96) return { coins: 1000 };
          if (rand < 99) return { coins: 2000 };
          if (rand < 99.5) return { coins: 0, skin: 'normal' };
          return { coins: 0, skin: 'limited' };
      }
  }

  function drawChest(ctx, type, x, y, slope) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(slope * Math.PI / 180);

      let cMain, cSub, cBand;
      if (type === 'copper') { cMain = '#d2691e'; cSub = '#8b4513'; cBand = '#a0522d'; }
      else if (type === 'silver') { cMain = '#e0e0e0'; cSub = '#9e9e9e'; cBand = '#bdbdbd'; }
      else if (type === 'gold') { cMain = '#ffd700'; cSub = '#b8860b'; cBand = '#daa520'; }
      else { cMain = '#e0ffff'; cSub = '#00ced1'; cBand = '#40e0d0'; } 

      let w = 24, h = 20;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-w/2 + 2, -h + 2, w, h);

      ctx.fillStyle = cSub;
      ctx.fillRect(-w/2, -h, w, h);
      ctx.fillStyle = cMain;
      ctx.fillRect(-w/2+2, -h+2, w-4, h-4);

      ctx.fillStyle = cBand;
      ctx.fillRect(-w/2, -h/2 - 2, w, 4);
      ctx.fillRect(-4, -h, 8, h);

      ctx.fillStyle = '#333';
      ctx.fillRect(-2, -h/2 - 2, 4, 6);

      if (type === 'diamond') {
          ctx.fillStyle = '#fff';
          ctx.fillRect(-w/2+4, -h+4, 4, 4);
          ctx.fillRect(w/2-8, -h+8, 4, 4);
          ctx.fillStyle = '#00bfff';
          ctx.fillRect(-2, -h+2, 4, 4);
      }
      ctx.restore();
  }

  function getChunkIndexByY(y) {
    let altMeters = Math.max(0, Math.floor((startZeroAltY - y) / PIXELS_PER_METER));
    return Math.floor(altMeters / CHUNK_METERS);
  }

  function addPlatformToChunk(p) {
    let idx = getChunkIndexByY(p.y);
    if (!chunks[idx]) {
      chunks[idx] = [];
    }
    chunks[idx].push(p);
  }

  function getPlatformWidthMult(isTutorial) {
      let sizeRand = Math.random();
      let mult;
      if (isTutorial && !IS_TEST_MODE) {
          if (sizeRand < 0.80) { mult = 2.1 + Math.random() * 2.9; } 
          else { mult = 5.1 + Math.random() * 0.9; }
      } else {
          if (sizeRand < 0.05) { mult = 1.0; } 
          else if (sizeRand < 0.30) { mult = 1.1 + Math.random() * 0.9; } 
          else if (sizeRand < 0.95) { mult = 2.1 + Math.random() * 2.9; } 
          else { mult = 5.1 + Math.random() * 0.9; }
      }
      return Math.round(mult * 10) / 10;
  }

  function generateSlopeParts(totalW, isTutorial) {
      if (!IS_TEST_MODE) {
          if (isTutorial || totalW < 96 || Math.random() >= 0.30) {
              return [{ wMult: 1.0, slope: 0 }];
          }
      }
      let deg = (Math.floor(Math.random() * 4) + 1) * 3; 
      let sign = Math.random() < 0.5 ? 1 : -1;
      let type = Math.floor(Math.random() * 4);
      
      switch(type) {
          case 0: return [{ wMult: 1.0, slope: sign * deg }];
          case 1: return [{ wMult: 0.5, slope: sign * deg }, { wMult: 0.5, slope: 0 }];
          case 2: return [{ wMult: 0.5, slope: 0 }, { wMult: 0.5, slope: sign * deg }];
          case 3: return [{ wMult: 0.5, slope: -sign * deg }, { wMult: 0.5, slope: sign * deg }];
          default: return [{ wMult: 1.0, slope: sign * deg }];
      }
  }

  function spawnNextPlatform(prevLogicalPlatform) {
    let isTutorial = (nextSafetyLevel === 1); 

    let prevLeftTop = prevLogicalPlatform.leftTop;
    let prevRightTop = prevLogicalPlatform.rightTop;
    let prevCenter = (prevLeftTop.x + prevRightTop.x) / 2;
    let autoDir = Math.random() < (prevCenter / width) ? -1 : 1;
    let baseX = autoDir === 1 ? prevRightTop.x : prevLeftTop.x;
    let baseY = autoDir === 1 ? prevRightTop.y : prevLeftTop.y;

    let gapY;
    if (prevLogicalPlatform.isGround) {
      gapY = 100 + Math.random() * 40; 
    } else if (Math.random() < 0.05 && !IS_TEST_MODE) {
      gapY = 100; 
    } else {
      gapY = IS_TEST_MODE ? (60 + Math.random() * 40) : (60 + Math.random() * 90); 
    }
    
    let y = baseY - gapY;
    let baseSafetyY = startZeroAltY - (nextSafetyLevel * CHUNK_HEIGHT_PX);
    let triggerSafetyY = baseSafetyY + (5 * PIXELS_PER_METER); 

    if (!IS_TEST_MODE && y <= triggerSafetyY) {
      let patterns = [ [11], [5, 6], [4, 7], [6, 5], [4, 3, 4], [3, 5, 3], [3, 2, 3, 3] ];
      let pattern = patterns[Math.floor(Math.random() * patterns.length)];
      
      let wTotalMass = player.size * 11; 
      let holeWidth = 32; 
      let holeStart = prevCenter - holeWidth / 2;
      let holeEnd = prevCenter + holeWidth / 2;
      
      let availableSpacing = (LIMIT_RIGHT - LIMIT_LEFT) - wTotalMass - holeWidth;
      let spacing = 0;
      if (pattern.length > 1) {
          spacing = Math.max(32, availableSpacing / (pattern.length - 1));
      }
      let totalPhysicalWidth = wTotalMass + spacing * (pattern.length - 1) + holeWidth;
      
      let startX = prevCenter - totalPhysicalWidth / 2;
      if (startX < LIMIT_LEFT) startX = LIMIT_LEFT;
      if (startX + totalPhysicalWidth > LIMIT_RIGHT) startX = LIMIT_RIGHT - totalPhysicalWidth;
      
      nextSafetyLevel++; 
      
      let currentX = startX;
      let aabbMinX = Infinity, aabbMaxX = -Infinity, aabbMinY = Infinity, aabbMaxY = -Infinity;
      
      let pObjs = [];
      for(let i = 0; i < pattern.length; i++) {
        let remainingW = player.size * pattern[i];
        
        while (remainingW > 0.01) {
            if (currentX >= holeStart - 0.01 && currentX < holeEnd - 0.01) { currentX = holeEnd; }
            let drawW = remainingW;
            if (currentX < holeStart && currentX + drawW > holeStart) { drawW = holeStart - currentX; }
            
            let p = { x: currentX, y: y, w: drawW, h: 20, isSafety: true, friction: 85, slope: 0, isLeftConnected: false, isRightConnected: false, offsetLeft: 0, offsetRight: 0 };
            pObjs.push(p);
            
            aabbMinX = Math.min(aabbMinX, p.x);
            aabbMaxX = Math.max(aabbMaxX, p.x + p.w);
            aabbMinY = Math.min(aabbMinY, p.y);
            aabbMaxY = Math.max(aabbMaxY, p.y + p.h);
            
            currentX += drawW;
            remainingW -= drawW;
            if (currentX >= holeStart - 0.01 && currentX < holeEnd - 0.01) { currentX = holeEnd; }
        }
        
        if (i < pattern.length - 1) {
            let remainingS = spacing;
            while (remainingS > 0.01) {
                if (currentX >= holeStart - 0.01 && currentX < holeEnd - 0.01) { currentX = holeEnd; }
                let sW = remainingS;
                if (currentX < holeStart && currentX + sW > holeStart) { sW = holeStart - currentX; }
                currentX += sW;
                remainingS -= sW;
                if (currentX >= holeStart - 0.01 && currentX < holeEnd - 0.01) { currentX = holeEnd; }
            }
        }
      }
      for (let i = 0; i < pObjs.length; i++) {
          pObjs[i].isLeftConnected = (i > 0);
          pObjs[i].isRightConnected = (i < pObjs.length - 1);
          addPlatformToChunk(pObjs[i]);
      }
      return { 
          aabb: { minX: aabbMinX, maxX: aabbMaxX, minY: aabbMinY, maxY: aabbMaxY }, 
          leftTop: {x: pObjs[0].x, y: pObjs[0].y},
          rightTop: {x: pObjs[pObjs.length-1].x + pObjs[pObjs.length-1].w, y: pObjs[pObjs.length-1].y},
          isSafety: true 
      };
    }
    
    let pMult = getPlatformWidthMult(isTutorial);
    let pw = player.size * pMult;

    let safeMinReach = (pw / 2) + 10;
    let safeMaxReach = safeMinReach + (isTutorial && !IS_TEST_MODE ? 50 : 70); 
    let currentReach = safeMinReach + Math.random() * (safeMaxReach - safeMinReach);

    let center = baseX + currentReach * autoDir;
    
    if (autoDir === -1 && center - pw / 2 < LIMIT_LEFT) {
        let tryRight = baseX + currentReach * 1;
        if (tryRight + pw / 2 <= LIMIT_RIGHT) { center = tryRight; autoDir = 1; }
    } else if (autoDir === 1 && center + pw / 2 > LIMIT_RIGHT) {
        let tryLeft = baseX + currentReach * -1;
        if (tryLeft - pw / 2 >= LIMIT_LEFT) { center = tryLeft; autoDir = -1; }
    }

    let px = center - pw / 2;
    
    let leftGap = px - LIMIT_LEFT;
    if (leftGap > 0 && leftGap < 27) px = LIMIT_LEFT;
    
    let rightGap = LIMIT_RIGHT - (px + pw);
    if (rightGap > 0 && rightGap < 27) px = LIMIT_RIGHT - pw;

    let parts = generateSlopeParts(pw, isTutorial);
    let currentPx = px;
    let currentPy = y;
    let aabbMinX = Infinity, aabbMaxX = -Infinity, aabbMinY = Infinity, aabbMaxY = -Infinity;
    
    let pObjs = [];
    for (let part of parts) {
        let partW = pw * part.wMult;
        let slopeTan = Math.tan(part.slope * Math.PI / 180);
        let partLeft = currentPx;
        let partRight = currentPx + partW;
        
        if (partLeft < LIMIT_RIGHT && partRight > LIMIT_LEFT) {
            let drawLeft = Math.max(LIMIT_LEFT, partLeft);
            let drawRight = Math.min(LIMIT_RIGHT, partRight);
            let drawW = drawRight - drawLeft;
            let drawY = currentPy + (drawLeft - partLeft) * slopeTan;
            
            if (drawW > 0) {
                let pObj = { x: drawLeft, y: drawY, w: drawW, h: 20, isSafety: false, friction: 85, slope: part.slope };
                
                if (drawW >= 32 && !isTutorial) {
                    if (Math.random() < 0.08) {
                        let altMeters = Math.max(0, Math.floor((startZeroAltY - drawY) / PIXELS_PER_METER));
                        pObj.chest = { type: getChestType(altMeters), x: drawLeft + drawW / 2, opened: false };
                    }
                }
                
                pObjs.push(pObj);
                
                aabbMinX = Math.min(aabbMinX, drawLeft);
                aabbMaxX = Math.max(aabbMaxX, drawRight);
                aabbMinY = Math.min(aabbMinY, drawY, drawY + drawW * slopeTan);
                aabbMaxY = Math.max(aabbMaxY, drawY + 20, drawY + drawW * slopeTan + 20);
            }
        }
        currentPx += partW;
        currentPy += partW * slopeTan;
    }

    if (pObjs.length === 0) {
        let fallbackW = player.size * 2.0;
        let fallbackX = Math.max(LIMIT_LEFT, Math.min(LIMIT_RIGHT - fallbackW, prevCenter - fallbackW / 2));
        let pObj = { x: fallbackX, y: y, w: fallbackW, h: 20, isSafety: false, friction: 85, slope: 0, isLeftConnected: false, isRightConnected: false, offsetLeft: 0, offsetRight: 0 };
        addPlatformToChunk(pObj);
        return { 
            aabb: { minX: pObj.x, maxX: pObj.x + pObj.w, minY: pObj.y, maxY: pObj.y + pObj.h }, 
            leftTop: {x: pObj.x, y: pObj.y},
            rightTop: {x: pObj.x + pObj.w, y: pObj.y},
            isSafety: false 
        }; 
    }
    
    for (let i = 0; i < pObjs.length; i++) {
        pObjs[i].isLeftConnected = (i > 0);
        pObjs[i].isRightConnected = (i < pObjs.length - 1);
        
        let sCurrent = pObjs[i].slope || 0;
        let rad = Math.PI / 180;
        
        pObjs[i].offsetLeft = pObjs[i].isLeftConnected 
            ? -pObjs[i].h * Math.tan(((pObjs[i-1].slope || 0) + sCurrent) / 2 * rad) 
            : 0;
        pObjs[i].offsetRight = pObjs[i].isRightConnected 
            ? -pObjs[i].h * Math.tan((sCurrent + (pObjs[i+1].slope || 0)) / 2 * rad) 
            : 0;
            
        addPlatformToChunk(pObjs[i]);
    }

    if (!IS_TEST_MODE && !isTutorial && Math.random() < 0.25) {
        let tryDir = Math.random() < 0.5 ? -1 : 1;
        let extraMult = getPlatformWidthMult(false);
        let extraW = player.size * extraMult;
        let gap = 32 + Math.random() * 64; 
        
        let extraStartX;
        let canPlace = false;
        
        if (tryDir === -1) {
            let aLeft = pObjs[0].x;
            extraStartX = aLeft - gap - extraW;
            if (extraStartX >= LIMIT_LEFT) {
                canPlace = true;
            } else {
                tryDir = 1;
            }
        }
        if (tryDir === 1 && !canPlace) {
            let originalLast = pObjs[pObjs.length - 1];
            let aRight = originalLast.x + originalLast.w;
            extraStartX = aRight + gap;
            if (extraStartX + extraW <= LIMIT_RIGHT) {
                canPlace = true;
            }
        }
        
        if (canPlace) {
            let partsB = generateSlopeParts(extraW, false);
            let cx = extraStartX;
            let cy = y;
            let extraPObjs = [];
            for (let part of partsB) {
                let partW = extraW * part.wMult;
                let slopeTan = Math.tan(part.slope * Math.PI / 180);
                
                if (cx < LIMIT_RIGHT && cx + partW > LIMIT_LEFT) {
                    let drawLeft = Math.max(LIMIT_LEFT, cx);
                    let drawRight = Math.min(LIMIT_RIGHT, cx + partW);
                    let drawW = drawRight - drawLeft;
                    let drawY = cy + (drawLeft - cx) * slopeTan;
                    
                    if (drawW > 0) {
                        let pObj = { x: drawLeft, y: drawY, w: drawW, h: 20, isSafety: false, friction: 85, slope: part.slope };
                        if (drawW >= 32 && Math.random() < 0.08) {
                            let altMeters = Math.max(0, Math.floor((startZeroAltY - drawY) / PIXELS_PER_METER));
                            pObj.chest = { type: getChestType(altMeters), x: drawLeft + drawW / 2, opened: false };
                        }
                        extraPObjs.push(pObj);
                        
                        aabbMinX = Math.min(aabbMinX, drawLeft);
                        aabbMaxX = Math.max(aabbMaxX, drawRight);
                        aabbMinY = Math.min(aabbMinY, drawY, drawY + drawW * slopeTan);
                        aabbMaxY = Math.max(aabbMaxY, drawY + 20, drawY + drawW * slopeTan + 20);
                    }
                }
                cx += partW;
                cy += partW * slopeTan;
            }
            
            for (let i = 0; i < extraPObjs.length; i++) {
                extraPObjs[i].isLeftConnected = (i > 0);
                extraPObjs[i].isRightConnected = (i < extraPObjs.length - 1);
                
                let sCurrent = extraPObjs[i].slope || 0;
                let rad = Math.PI / 180;
                
                extraPObjs[i].offsetLeft = extraPObjs[i].isLeftConnected 
                    ? -extraPObjs[i].h * Math.tan(((extraPObjs[i-1].slope || 0) + sCurrent) / 2 * rad) 
                    : 0;
                extraPObjs[i].offsetRight = extraPObjs[i].isRightConnected 
                    ? -extraPObjs[i].h * Math.tan((sCurrent + (extraPObjs[i+1].slope || 0)) / 2 * rad) 
                    : 0;
                
                pObjs.push(extraPObjs[i]);
                addPlatformToChunk(extraPObjs[i]);
            }
        }
    }

    let fP = pObjs[0];
    let lP = pObjs[pObjs.length - 1];
    return { 
        aabb: { minX: aabbMinX, maxX: aabbMaxX, minY: aabbMinY, maxY: aabbMaxY }, 
        leftTop: {x: fP.x, y: fP.y},
        rightTop: {x: lP.x + lP.w, y: lP.y + lP.w * Math.tan((lP.slope||0)*Math.PI/180)},
        isSafety: false 
    }; 
  }

  function createInitialPlatforms() {
    chunks = {};
    let ground = { x: LIMIT_LEFT, y: startGroundY, w: LIMIT_RIGHT - LIMIT_LEFT, h: 400, isSafety: true, isGround: true, friction: 85, slope: 0, isLeftConnected: false, isRightConnected: false, offsetLeft: 0, offsetRight: 0 };

  function getActivePlatforms(currentChunkIndex) {
    let active = [];
    for (let offset = -1; offset <= 1; offset++) {
      let targetIndex = currentChunkIndex + offset;
      
      let chunkTopY = startZeroAltY - (targetIndex + 1) * CHUNK_HEIGHT_PX;
      active.push({ x: LIMIT_LEFT - 96, y: chunkTopY, w: 96, h: CHUNK_HEIGHT_PX, isSafety: true, friction: 0, slope: 0, invisibleWall: true });
      active.push({ x: LIMIT_RIGHT, y: chunkTopY, w: 96, h: CHUNK_HEIGHT_PX, isSafety: true, friction: 0, slope: 0, invisibleWall: true });

      if (targetIndex >= 0 && chunks[targetIndex]) {
        active = active.concat(chunks[targetIndex]);
      }
    }
    return active;
  }

  function drawWeeds(ctx, dp, seedOffset, color, minChars, maxChars, offsetY) {
      let seed = 5678 + seedOffset;
      let minW = minChars * 32;
      let maxW = maxChars * 32;
      let totalWeedWidth = minW + pRand(seed++) * (maxW - minW);
      
      let patches = [];
      let remaining = totalWeedWidth;
      while (remaining > 0) {
          let pw = 20 + pRand(seed++) * 40; 
          if (pw > remaining) pw = remaining;
          patches.push(pw);
          remaining -= pw;
      }
      
      let spacing = (dp.w - 32 - totalWeedWidth) / (patches.length + 1);
      let px = dp.x + 16 + spacing;
      
      ctx.fillStyle = color;
      let baseY = dp.y + offsetY; 
      
      for (let pw of patches) {
          let cx = px;
          while (cx < px + pw) {
              let h = 3 + pRand(seed++) * 21; 
              let w = 2 + pRand(seed++) * 4;  
              let slant = (pRand(seed++) - 0.5) * 10; 
              
              let tipRatio = 0.3 + pRand(seed++) * 0.2;
              let baseH = h * (1 - tipRatio);
              let slantBase = slant * (1 - tipRatio);
              
              ctx.beginPath();
              ctx.moveTo(cx, baseY);
              ctx.lineTo(cx + w, baseY);
              ctx.lineTo(cx + w + slantBase, baseY - baseH);
              ctx.lineTo(cx + w/2 + slant, baseY - h);
              ctx.lineTo(cx + slantBase, baseY - baseH);
              
              ctx.closePath();
              ctx.fill();
              
              cx += w * 0.5 + pRand(seed++) * 3;
          }
          px += pw + spacing;
      }
  }

  function startAction() {
    initAudio();
    if (!isPlaying || isPaused) return;
    if (player.isClimbing) return;
    
    const now = Date.now();
    
    if (hitStopEndTime > now && player.wallHitPlatform && (player.wallHitDir === 1 || player.wallHitDir === -1)) {
        
        let isTiltedAway = (player.wallHitDir === 1 && tilt < 0) || (player.wallHitDir === -1 && tilt > 0);

        if (isTiltedAway) {
            let jumpX = tilt * player.speed * 1.0; 
            let yAngle = Math.max(0, -tiltY); 
            let jumpY = -yAngle * player.speed * 1.15; 
            
            player.vx = jumpX;
            player.airVx = jumpX;
            player.vy = jumpY;
            
            player.onGround = false;
            player.isClimbing = false;
            player.currentPlatform = null;
            player.highestYInAir = player.y; 
            
            player.jumpStartX = player.x;
            player.jumpStartY = player.y;
            player.lastJumpChargeTime = 1000; 
            player.isBigFalling = false;
            player.isWallJumping = true; 
            
            hitStopEndTime = 0; 
            player.wallHitPlatform = null;
            player.wallHitDir = 0;
            
            playSeJump();
        } else {
            player.isClimbing = true;
            player.climbStartTime = now;
            
            let cDur = 300; 
            
            player.climbDuration = cDur;
            player.climbEndTime = now + cDur; 
            
            player.climbStartY = player.y; 
            player.climbStartX = player.x; 
            
            let tan = player.wallHitPlatform.slope ? Math.tan(player.wallHitPlatform.slope * Math.PI / 180) : 0;
            let climbEndX = (player.wallHitDir === 1) 
                ? player.wallHitPlatform.x + player.size * 0.5 
                : player.wallHitPlatform.x + player.wallHitPlatform.w - player.size * 0.5;
            let climbEndY = player.wallHitPlatform.y + (climbEndX - player.wallHitPlatform.x) * tan - (player.size * 0.95 / 2);
            
            player.climbTargetY = climbEndY;
            player.climbTargetX = climbEndX;
            
            hitStopEndTime = 0; 
            player.vy = 0;
            player.airVx = 0;
            player.vx = 0; 
            
            playSeClimb();
        }
    }
  }

  function endAction() {
    if (!isPlaying || isPaused) return;
    isPointerDown = false;
    lastReleaseTime = Date.now(); 

    if (isPressing) {
      isPressing = false;
      if (player.isClimbing) {
        pressStartTime = 0;
        player.lastJumpChargeTime = 0;
      } else if (player.onGround && hitStopEndTime <= Date.now()) {
        const pressDuration = Date.now() - pressStartTime;
        const maxTicks = 20; 
        let ticks = Math.floor(pressDuration / 100);
        if (ticks < 1) ticks = 1;
        if (ticks > maxTicks) ticks = maxTicks;

        const jumpRatio = ticks / maxTicks;
        player.vy = player.maxJumpPower * Math.sqrt(jumpRatio);
        player.airVx = player.vx;
        
        player.onGround = false;
        player.isClimbing = false;
        player.currentPlatform = null;
        player.highestYInAir = player.y; 
        
        player.jumpStartX = player.x;
        player.jumpStartY = player.y;
        player.lastJumpChargeTime = pressDuration;
        player.isBigFalling = false;
        
        playSeJump();
      } else {
        pressStartTime = 0;
        player.lastJumpChargeTime = 0;
      }
    }
  }

  window.addEventListener('touchstart', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('#pauseBtn') || e.target.closest('#pauseMenu')) return;
      isPointerDown = true;
      
      const now = Date.now();
      
      if (hitStopEndTime > now && player.wallHitPlatform && (player.wallHitDir === 1 || player.wallHitDir === -1)) {
          startAction(); 
          tapTimes = []; 
          return; 
      }
      
      tapTimes.push(now);
      tapTimes = tapTimes.filter(t => now - t <= 1000); 
      
      if (tapTimes.length >= 2) {
          let isConfused = (player.confusionEndTime > now) || (player.bigFallPenaltyEndTime > now);
          if (player.onGround && hitStopEndTime <= now && !isConfused && Math.abs(tilt) < 15 && player.wallHitDir === 0) {
              isPendingCalibration = true;
              calibrationHoldStartTime = now;
          }
          tapTimes = []; 
      }
  }, {passive: false});

  window.addEventListener('touchend', (e) => {
      if (isPendingCalibration) {
          isPendingCalibration = false;
      }
      if (isCalibrating) {
          isCalibrating = false;
          baseQuat = eulerToQuat(currentAlpha, currentBeta, currentGamma);
          showSystemMessage("ジャイロの傾き調整が完了しました");
          isPointerDown = false;
          lastReleaseTime = Date.now();
          return;
      }
      endAction();
  });

  function handleOrientation(event) {
      if (!isPlaying || isPaused) return;
      
      let alpha = event.alpha || 0;
      let beta = event.beta || 0;
      let gamma = event.gamma || 0;
      
      currentAlpha = alpha;
      currentBeta = beta;
      currentGamma = gamma;
      
      let q = eulerToQuat(alpha, beta, gamma);
      
      if (needsInitialCalibration) {
          baseQuat = q;
          needsInitialCalibration = false;
      }
      
      let q_inv = invertQuat(baseQuat);
      let q_rel = multiplyQuat(q_inv, q);
      let relAngles = getRelEuler(q_rel);
      
      let g = relAngles.gamma;
      if (g > 45) g = 45;
      if (g < -45) g = -45;
      tilt = g;

      let b = relAngles.beta;
      if (b > 45) b = 45;
      if (b < -45) b = -45;
      tiltY = b;
  }
