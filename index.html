  function update() {
    if (!isPlaying) return;
    
    const now = Date.now();
    
    if (isPaused) {
      requestAnimationFrame(update);
      return;
    }

    if (timerRunning && !isPaused) {
        elapsedMs += (now - lastFrameTime);
        
        let totalCenti = Math.floor(elapsedMs / 10);
        let c = totalCenti % 100;
        let totalSec = Math.floor(totalCenti / 100);
        let s = totalSec % 60;
        let m = Math.floor(totalSec / 60) % 60;
        let h = Math.floor(totalSec / 3600);
        
        if (h > 99) { h = 99; m = 99; s = 99; c = 99; }
        
        let pad = (num) => num.toString().padStart(2, '0');
        timeDisp.innerText = `${pad(h)}:${pad(m)}:${pad(s)}.${pad(c)}`;
    }
    lastFrameTime = now;

    coinDisp.innerText = totalCoins;

    ctx.clearRect(0, 0, width, height);

    let currentChunkIndex = getChunkIndexByY(player.y);
    manageCaches(currentChunkIndex); 
    let activePlatforms = getActivePlatforms(currentChunkIndex);

    let activeMessage = null;
    let currentOpacity = 0;
    let useCSSFade = true;

    let bigFallElapsed = now - bigFallStartTime;
    
    if (isCalibrating) {
        activeMessage = "ジャイロの傾きを調整中...";
        useCSSFade = true;
        currentOpacity = 1;
    } else if (bigFallElapsed < 4500) {
        activeMessage = currentBigFallMessage;
        useCSSFade = false; 
        messageBanner.style.transition = 'none';
        
        if (bigFallElapsed < 1500) {
            currentOpacity = bigFallElapsed / 1500;
        } else if (bigFallElapsed < 3000) {
            currentOpacity = 1;
        } else {
            currentOpacity = 1 - ((bigFallElapsed - 3000) / 1500);
        }
    } else if (now < systemMessageEndTime) {
        activeMessage = systemMessage;
        currentOpacity = 1;
        useCSSFade = true;
    } else {
        if (player.y > startGroundY - 200) { 
            for (let sign of initialSigns) {
                if (Math.abs(player.x - sign.x) < 25 && Math.abs(player.y - sign.y) < 50) {
                    activeMessage = sign.message;
                    break;
                }
            }
        }
        if (activeMessage) {
            currentOpacity = 1;
            useCSSFade = true;
        }
    }

    if (activeMessage) {
        let htmlStr = activeMessage.replace(/\n/g, '<br>');
        if (messageBanner.innerHTML !== htmlStr) {
            messageBanner.innerHTML = htmlStr;
        }
    }
    
    if (useCSSFade) {
        messageBanner.style.transition = 'opacity 0.2s ease-in-out';
        messageBanner.style.opacity = activeMessage ? '1' : '0';
    } else {
        messageBanner.style.opacity = currentOpacity;
    }

    let isBigFallConfused = player.bigFallPenaltyEndTime > now;
    let isNormalConfused = player.confusionEndTime > now;

    if (isPendingCalibration) {
        if (!player.onGround || Math.abs(tilt) >= 15 || isPointerDown === false || (player.confusionEndTime > now || player.bigFallPenaltyEndTime > now)) {
            isPendingCalibration = false;
        } else if (now - calibrationHoldStartTime >= 1000) {
            isCalibrating = true;
            isPendingCalibration = false;
            lastCalibrationSoundTime = 0; 
        }
    }

    if (isCalibrating && !player.onGround) {
        isCalibrating = false;
    }

    if (isPointerDown && !isPressing) {
       if (!isNormalConfused && !isBigFallConfused && now - lastReleaseTime >= 300 && !isCalibrating && !isPendingCalibration) {
           isPressing = true;
           pressStartTime = now;
           lastChargeSoundTime = now; 
       }
    }

    if (isPressing && hitStopEndTime <= now) {
        if (now - lastChargeSoundTime >= 400) {
            playSeCharge();
            lastChargeSoundTime = now;
        }
    }

    if (isCalibrating) {
        isPressing = false; 
        if (now - lastCalibrationSoundTime >= 250) {
            playSePurupuru();
            lastCalibrationSoundTime = now;
        }
    } else if (player.isClimbing) {
      let elapsed = now - player.climbStartTime;
      let ratio = elapsed / player.climbDuration;
      
      if (ratio < 0.6) {
        let yRatio = ratio / 0.6;
        player.y = player.climbStartY + (player.climbTargetY - player.climbStartY) * yRatio;
        player.x = player.climbStartX;
      } else {
        let xRatio = (ratio - 0.6) / 0.4;
        player.y = player.climbTargetY;
        player.x = player.climbStartX + (player.climbTargetX - player.climbStartX) * xRatio;
      }
      
      if (ratio >= 1) {
        player.x = player.climbTargetX;
        player.y = player.climbTargetY;
        player.isClimbing = false;
        player.onGround = true;
        player.highestYInAir = player.y; 
        player.wallHitPlatform = null;
        player.wallHitDir = 0;
        player.vx = 0; 
        player.hasPlayedFallSound = false; 
        player.isWallJumping = false; 
      }
    } else if (hitStopEndTime > now) {
      player.vx = 0; 
    } else {
      
      if (player.wallHitPlatform !== null && !player.isClimbing) {
          if (player.wallHitDir === 1 || player.wallHitDir === -1) {
              player.airVx = 0;
              player.vx = 0;
              player.vy = 0;
              player.onGround = false;
          }
          player.wallHitPlatform = null;
          player.wallHitDir = 0;
      }

      if (isNormalConfused || isBigFallConfused) {
          isPressing = false; 
      }

      let effectiveTilt = tilt;
      let slipTilt = 0;

      if (player.onGround && player.currentPlatform && player.currentPlatform.slope) {
          slipTilt = Math.sin(player.currentPlatform.slope * Math.PI / 180) * 60;
      }

      let inTutorial = player.y > startZeroAltY - CHUNK_HEIGHT_PX;
      let tiltMult = (inTutorial && !IS_TEST_MODE) ? 0.8 : 1.0;
      
      let activeTilt = effectiveTilt * tiltMult;
      
      if (isBigFallConfused || isNormalConfused) {
          activeTilt = -effectiveTilt * 1.0; 
      }

      if (isCalibrating || isPendingCalibration) {
          activeTilt = 0;
      }

      activeTilt += slipTilt;
      
      let preX = player.x;

      if (player.onGround) {
          let friction = 85; 
          if (player.currentPlatform && player.currentPlatform.friction !== undefined) {
              friction = player.currentPlatform.friction;
          }
          let normFriction = friction / 100; 
          let targetVx = activeTilt * player.speed;
          let accel = 0.02 + (normFriction * 0.28); 
          
          player.vx += (targetVx - player.vx) * accel;
          player.x += player.vx;
          
          if (player.currentPlatform && !player.currentPlatform.invisibleWall) {
              let p = player.currentPlatform;
              if (player.x < p.x - 12 || player.x > p.x + p.w + 12) {
                  player.onGround = false;
                  player.currentPlatform = null;
                  player.airVx = player.vx;
                  player.jumpStartX = player.x;
                  player.jumpStartY = player.y;
              }
          }
          
      } else {
          player.x += player.airVx + (activeTilt * player.airControl);
          player.vx = player.airVx; 
      }

      player.vy += player.gravity;
      if (player.vy > 24) player.vy = 24;
      player.y += player.vy;

      let wasOnGround = player.onGround;
      player.onGround = false;

      let shapeTop, shapeBottom, shapeLeft, shapeRight;
      let isAirTeardrop = !wasOnGround && hitStopEndTime <= now;
      let rMax = player.size * 0.95 / 2;

      if (isAirTeardrop) {
          let speed = Math.hypot(player.vx, player.vy);
          let angle = Math.atan2(player.vy, player.vx);
          let stretch = Math.min(speed / 15, 1.0);
          
          let rFront = (player.size / 2) - 3;
          let rBack = (player.size / 2) - 5;
          let cxFront = player.x + Math.cos(angle) * (player.size * 0.5 * stretch * 0.4);
          let cyFront = player.y + Math.sin(angle) * (player.size * 0.5 * stretch * 0.4);
          let cxBack = player.x - Math.cos(angle) * (player.size * 0.5 * stretch * 0.2);
          let cyBack = player.y - Math.sin(angle) * (player.size * 0.5 * stretch * 0.2);

          shapeBottom = Math.max(cyFront + rFront, cyBack + rBack);
          shapeTop = Math.min(cyFront - rFront, cyBack - rBack);
          shapeLeft = Math.min(cxFront - rFront, cxBack - rBack);
          shapeRight = Math.max(cxFront + rFront, cxBack + rBack);
      } else {
          shapeBottom = player.y + rMax;
          shapeTop = player.y - rMax;
          shapeLeft = player.x - rMax;
          shapeRight = player.x + rMax;
      }

      if (isAirTeardrop) {
          if (player.y - player.highestYInAir >= 320 && !player.hasPlayedFallSound && player.vy > 0) {
              player.hasPlayedFallSound = true;
              playSeFall();
          }
          if (player.y - player.highestYInAir >= 400 && !player.isBigFalling && player.vy > 0) {
              player.isBigFalling = true;
          }
      }

      if (!player.onGround) {
          player.highestYInAir = Math.min(player.highestYInAir, player.y);
      }

      let leftWall = LIMIT_LEFT;
      let rightWall = LIMIT_RIGHT;

      if (shapeLeft < leftWall) {
        player.x = leftWall + (player.x - shapeLeft);
        player.airVx = 0; 
        player.vx = 0;
      }
      if (shapeRight > rightWall) {
        player.x = rightWall - (shapeRight - player.x);
        player.airVx = 0;
        player.vx = 0;
      }

      let checkBottom = wasOnGround ? shapeBottom + 12 : shapeBottom;
      const distFromStart = Math.hypot(player.x - player.jumpStartX, player.y - player.jumpStartY);

      for (let p of activePlatforms) {
          if (p.invisibleWall) continue;
          if (p.chest && !p.chest.opened) {
              let tan = p.slope ? Math.tan(p.slope * Math.PI / 180) : 0;
              let cY = p.y + (p.chest.x - p.x) * tan;
              let cW = 24, cH = 20;
              let cMinX = p.chest.x - cW/2;
              let cMaxX = p.chest.x + cW/2;
              let cMinY = cY - cH;
              let cMaxY = cY;

              if (shapeRight > cMinX && shapeLeft < cMaxX && shapeBottom > cMinY && shapeTop < cMaxY) {
                  p.chest.opened = true;
                  let res = openChest(p.chest.type);
                  playSeChestOpen(p.chest.type);
                  if (res.skin) {
                      let sName = res.skin === 'limited' ? '限定スキン' : '通常スキン';
                      addFloatingText(p.chest.x, cMinY, sName + " GET!", "#ff00ff");
                  } else {
                      totalCoins += res.coins;
                      addFloatingText(p.chest.x, cMinY, "+" + res.coins, "#ffff00");
                      saveData();
                  }
              }
          }
      }

      for (let p of activePlatforms) {
        if (p.invisibleWall) continue; 
        if (hitStopEndTime > now) break; 

        let tan = p.slope ? Math.tan(p.slope * Math.PI / 180) : 0;
        
        if (shapeRight > p.x && shapeLeft < p.x + p.w) {
          
          let checkX = player.x;
          if (checkX > p.x + p.w) {
              if (p.isRightConnected) continue; 
              checkX = p.x + p.w;
          } else if (checkX < p.x) {
              if (p.isLeftConnected) continue;
              checkX = p.x;
          }
          
          let surfaceY = p.y + (checkX - p.x) * tan;
          let bottomY = Math.max(p.y, p.y + p.w * tan) + p.h;

          if (checkBottom > surfaceY && shapeTop < bottomY) {
            
            let oldX = player.x - player.vx;
            let oldY = player.y - player.vy;
            
            let oTop, oBottom, oLeft, oRight;
            if (isAirTeardrop) {
                oTop = shapeTop - player.vy;
                oBottom = shapeBottom - player.vy;
                oLeft = shapeLeft - player.vx;
                oRight = shapeRight - player.vx;
            } else {
                oTop = oldY - rMax;
                oBottom = oldY + rMax;
                oLeft = oldX - rMax;
                oRight = oldX + rMax;
            }

            let oldCheckX = oldX;
            if (oldCheckX > p.x + p.w) {
                oldCheckX = p.isRightConnected ? oldX : p.x + p.w;
            } else if (oldCheckX < p.x) {
                oldCheckX = p.isLeftConnected ? oldX : p.x;
            }
            let oldSurfaceY = p.y + (oldCheckX - p.x) * tan;

            let hitFromLeft  = oRight <= p.x + 8;
            let hitFromRight = oLeft >= p.x + p.w - 8;
            
            let hitFromAbove = false;
            if (player.vy >= 0) {
                if (wasOnGround && player.vy >= -2) {
                    hitFromAbove = true;
                } else if (hitFromLeft || hitFromRight) {
                    if (oBottom <= oldSurfaceY + 1) {
                        hitFromAbove = true;
                    }
                } else {
                    if (oBottom <= oldSurfaceY + 24) {
                        hitFromAbove = true;
                    }
                }
            }
            let hitFromBelow = oTop >= bottomY - 12;

            if (hitFromAbove) {
              let newY = surfaceY - (shapeBottom - player.y);
              
              if (!wasOnGround) {
                  if (player.isBigFalling) {
                      playSeCrash();
                      hitStopEndTime = now + 500; 
                      player.hitStopCooldownEndTime = now + 700;
                      player.wallHitDir = 2; 
                      player.vx = 0; 
                      
                      player.bigFallPenaltyEndTime = now + 1500; 
                      player.pendingCeilingConfusion = false; 
                      
                      bigFallStartTime = now;
                      currentBigFallMessage = bigFallMessages[Math.floor(Math.random() * bigFallMessages.length)];
                  } else {
                      if (player.vy > 2 || distFromStart >= player.size) {
                          playSeHitLight();
                      }
                      
                      if (player.pendingCeilingConfusion) {
                          player.confusionEndTime = now + 1000;
                          player.pendingCeilingConfusion = false;
                      }
                  }
              }

              if (!player.onGround || newY < player.y) {
                  player.y = newY;
                  player.currentPlatform = p; 
              }
              
              player.vy = 0;
              player.airVx = 0; 
              player.onGround = true;
              player.highestYInAir = player.y; 
              player.isBigFalling = false;
              player.lastJumpChargeTime = 0; 
              player.hasPlayedFallSound = false; 
              player.isWallJumping = false; 
            } 
            else if (hitFromBelow && player.vy < 0) {
              let hitLeftEdge = (shapeRight >= p.x && shapeRight <= p.x + 5);
              let hitRightEdge = (shapeLeft >= p.x + p.w - 5 && shapeLeft <= p.x + p.w);
              
              if (hitLeftEdge || hitRightEdge) {
                  let wallX = hitLeftEdge ? p.x : p.x + p.w;
                  if (hitLeftEdge) {
                      player.x = p.x - (shapeRight - player.x) + 5;
                  } else {
                      player.x = p.x + p.w + (player.x - shapeLeft) - 5;
                  }
                  
                  let wallTopY = p.y + (wallX - p.x) * tan;
                  player.y = wallTopY;
                  
                  player.vy = 0;
                  player.airVx = 0;
                  player.vx = 0;
                  
                  if (distFromStart >= player.size) {
                      playSeHitLight();
                      let stunTime = 800; 
                      hitStopEndTime = now + stunTime; 
                      player.hitStopCooldownEndTime = now + stunTime + 200;
                      player.wallHitDir = hitLeftEdge ? 1 : -1; 
                      player.wallHitType = 2; 
                      player.wallHitPlatform = p;
                  }
              } else {
                  let edgeX = Math.max(p.x, Math.min(p.x + p.w, player.x));
                  let edgeY = p.y + (edgeX - p.x) * tan + p.h;
                  player.y = edgeY + (player.y - shapeTop);
                  player.vy = 0; 
                  
                  if (!wasOnGround) {
                      if (distFromStart >= player.size) {
                          if (player.isWallJumping || player.lastJumpChargeTime >= 1100) {
                              playSeHitHeavy();
                              player.pendingCeilingConfusion = true; 
                              if (player.hitStopCooldownEndTime <= now) {
                                  hitStopEndTime = now + 500; 
                                  player.hitStopCooldownEndTime = now + 700;
                                  player.wallHitDir = 0; 
                                  player.wallHitPlatform = p;
                              }
                              player.isWallJumping = false; 
                          } else {
                              playSeHitLight();
                              if (player.hitStopCooldownEndTime <= now) {
                                  hitStopEndTime = now + 300;
                                  player.hitStopCooldownEndTime = now + 500;
                                  player.wallHitDir = 0; 
                                  player.wallHitPlatform = p;
                              }
                          }
                      }
                  }
              }
            }
            else if (hitFromLeft || hitFromRight) {
              let wallX = hitFromLeft ? p.x : p.x + p.w;
              let wTop = p.y + (wallX - p.x) * tan;
              let wBot = wTop + p.h; 
              
              let cTop = Math.max(shapeTop, wTop);
              let cBot = Math.min(shapeBottom, wBot);
              
              let cTopRatio = (wBot - cTop) / p.h * 100;
              let cBotRatio = (wBot - cBot) / p.h * 100;
              
              let hType = 3;
              if (cBotRatio >= 51) hType = 1;         
              else if (cTopRatio <= 50) hType = 2;    
              else hType = 3;                         

              if (hitFromLeft) player.x = p.x - rMax;
              else player.x = (p.x + p.w) + rMax;
              
              player.airVx = 0;
              player.vx = 0;
              
              if (!wasOnGround && player.hitStopCooldownEndTime <= now) {
                  if (distFromStart >= player.size) {
                      playSeHitLight();
                      
                      let stunTime = 800; 
                      
                      hitStopEndTime = now + stunTime; 
                      player.hitStopCooldownEndTime = now + stunTime + 200;
                      player.wallHitDir = hitFromLeft ? 1 : -1; 
                      player.wallHitType = hType;
                      player.wallHitPlatform = p;
                  }
              }
            }
          }
        }
      }

      if (wasOnGround && !player.onGround) {
          player.airVx = player.vx;
          if (player.currentPlatform && player.currentPlatform.slope) {
              player.vy = player.vx * Math.tan(player.currentPlatform.slope * Math.PI / 180);
          }
          if (player.lastJumpChargeTime === 0) {
              player.jumpStartX = player.x;
              player.jumpStartY = player.y;
          }
      }
      
      if (player.onGround) {
          if (Math.abs(player.x - preX) > 0.5 && now - player.lastMoveSoundTime > 350) {
              createSlimeBloop(300, 500, 0.15);
              player.lastMoveSoundTime = now;
          }
      }
    }

    if (player.y < maxAltitude || maxAltitude === 0) maxAltitude = player.y;
    
    let targetCameraY = player.y - height * 0.6;
    if (targetCameraY > 0) targetCameraY = 0; 
    cameraY += (targetCameraY - cameraY) * 0.15;
    
    let targetCameraX = player.x - width / 2;
    targetCameraX = Math.max(-STAGE_EXPAND, Math.min(STAGE_EXPAND, targetCameraX));
    cameraX += (targetCameraX - cameraX) * 0.15;

    let currentAlt = Math.max(0, Math.floor((startZeroAltY - player.y) / PIXELS_PER_METER));
    currentAltElement.innerText = currentAlt;
    
    if (currentAlt > bestScore) {
        bestScore = currentAlt;
    }
    maxAltElement.innerText = bestScore;

    if (currentAlt >= 5000 && !achievements.story && !sessionFlags.story) {
        sessionFlags.story = true;
        achievements.story = true;
        if (!unlockedSkins.includes('story_clear')) unlockedSkins.push('story_clear');
        saveData();
        showAchievement("🎉 STORY CLEAR! (5000m) 🎉", "ストーリークリア実績解除！\n専用スキンを獲得しました！");
    }
    if (currentAlt >= 8000 && !achievements.extra && !sessionFlags.extra) {
        sessionFlags.extra = true;
        achievements.extra = true;
        if (!unlockedSkins.includes('extra_clear')) unlockedSkins.push('extra_clear');
        saveData();
        showAchievement("🔥 Jumping Mad Jump Machine 🔥", "8000m到達実績解除！\n専用スキンを獲得しました！");
    }
    if (currentAlt >= 15000 && !achievements.final && !sessionFlags.final) {
        sessionFlags.final = true;
        achievements.final = true;
        saveData();
        showAchievement("👑 完全クリア (15000m) 👑", "ゲーム完全クリア！\nあなたは真のジャンプマスターです！");
    }

    if (generatedHighestPlatform.aabb.minY > cameraY - height) {
      generatedHighestPlatform = spawnNextPlatform(generatedHighestPlatform);
    }

    let shakeX = 0;
    let shakeY = 0;
    if (hitStopEndTime > now && !player.isClimbing) {
      shakeX = (Math.random() - 0.5) * 8;
      shakeY = (Math.random() - 0.5) * 8;
    }

    ctx.save();
    let camPX = cameraX * PARALLAX_FACTOR_CLOUD;
    let camPY = cameraY * PARALLAX_FACTOR_CLOUD;
    ctx.translate(-camPX + shakeX, -camPY + shakeY);

    for (let c of clouds) {
        c.x += c.speed;
        
        if (c.x > camPX + width + 100) {
            c.x = camPX - c.data.w - 50;
            c.y = camPY + Math.random() * height * 1.5 - height * 0.2;
            c.data = createCloudParts();
            c.speed = 0.1 + Math.random() * 0.3;
        }
        if (c.y > camPY + height + 100) {
            c.y = camPY - 100 - Math.random() * 200;
            c.x = camPX + Math.random() * (width + c.data.w) - c.data.w;
            c.data = createCloudParts();
        }
        if (c.y < camPY - 300) {
            c.y = camPY + height + 100 + Math.random() * 200;
            c.x = camPX + Math.random() * (width + c.data.w) - c.data.w;
            c.data = createCloudParts();
        }

        let logicalY = c.y + cameraY * (1 - PARALLAX_FACTOR_CLOUD);
        let altMeters = (startZeroAltY - logicalY) / PIXELS_PER_METER;
        
        if (altMeters > 20) {
            let fade = Math.min(1, (altMeters - 20) / 10);
            ctx.globalAlpha = fade;
            
            ctx.save();
            ctx.translate(c.x, c.y);
            for (let p of c.data.parts) {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.op})`;
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }
            ctx.restore();
            ctx.globalAlpha = 1.0;
        }
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX + shakeX, -cameraY + shakeY);

    let towerLeft = 48;
    let towerRight = width - 48;
    let groundY = startGroundY;
    let topY = groundY - 15000 * PIXELS_PER_METER;

    let screenTopY = cameraY;
    let screenBottomY = cameraY + height;
    let drawTop = Math.max(topY, screenTopY - 100); 
    let drawBottom = Math.min(groundY, screenBottomY + 100);

    if (drawTop < drawBottom) {
        let topIdx = getChunkIndexByY(drawTop);
        let bottomIdx = getChunkIndexByY(drawBottom);
        
        for (let idx = Math.min(topIdx, bottomIdx); idx <= Math.max(topIdx, bottomIdx); idx++) {
            if (!towerCaches[idx]) {
                towerCaches[idx] = renderTowerChunkToCache(idx);
            }
            let chunkTopY = startZeroAltY - (idx + 1) * CHUNK_HEIGHT_PX;
            ctx.drawImage(towerCaches[idx], towerLeft, chunkTopY);
        }
    }

    for (let sign of initialSigns) {
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(sign.x - 2, sign.y - 25, 4, 25);
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(sign.x - 16, sign.y - 25, 32, 16);
      ctx.fillStyle = '#eebd9d';
      ctx.fillRect(sign.x - 14, sign.y - 23, 28, 12);
      
      let bounce = Math.sin(now / 150) * 4;
      let iconY = sign.y - 35 + bounce;

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(sign.x, iconY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sign.x - 4, iconY + 5);
      ctx.lineTo(sign.x + 4, iconY + 5);
      ctx.lineTo(sign.x, iconY + 14);
      ctx.fill();

      ctx.fillStyle = "red";
      ctx.font = "bold 14px 'DotGothic16', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("！", sign.x, iconY);
    }

    for (let p of activePlatforms) {
      if (p.invisibleWall) continue; 
      
      if (!p.cachedCanvas) {
          renderPlatformToCache(p);
      }
      ctx.drawImage(p.cachedCanvas, p.x + p.cacheMinX, p.y + p.cacheMinY);

      if (p.chest && !p.chest.opened) {
          let tan = p.slope ? Math.tan(p.slope * Math.PI / 180) : 0;
          let cY = p.y + (p.chest.x - p.x) * tan;
          drawChest(ctx, p.chest.type, p.chest.x, cY, p.slope || 0);
      }
    }

    ctx.save();
    
    let isCharging = isPressing && (player.onGround || player.isClimbing);
    let isCeilingBonk = hitStopEndTime > now && player.wallHitDir === 0 && !player.isClimbing;
    let isFloorBonk = hitStopEndTime > now && player.wallHitDir === 2 && !player.isClimbing;
    let isLeftBonk = hitStopEndTime > now && player.wallHitDir === 1 && !player.isClimbing;
    let isRightBonk = hitStopEndTime > now && player.wallHitDir === -1 && !player.isClimbing;
    let inAir = !player.onGround && !player.isClimbing && hitStopEndTime <= now;
    let speed = Math.hypot(player.vx, player.vy);

    let sw = player.size;
    let sh = player.size;
    let pSlope = (player.wallHitPlatform && player.wallHitPlatform.slope) ? player.wallHitPlatform.slope * Math.PI / 180 : 0;
    
    let cx = player.x;
    let cy = player.y + sh / 2;
    
    if (isLeftBonk || isRightBonk || player.isClimbing) {
        let p = player.wallHitPlatform;
        if (p) {
            let tan = p.slope ? Math.tan(p.slope * Math.PI / 180) : 0;
            let wallFaceX = (player.wallHitDir === 1) ? p.x : p.x + p.w;
            let wTop = p.y + (wallFaceX - p.x) * tan;
            cx = wallFaceX; 

            if (player.isClimbing) {
                let ratio = (now - player.climbStartTime) / player.climbDuration;
                if (ratio < 0.6) {
                    cy = wTop + (sw * 0.65);
                } else {
                    let t = (ratio - 0.6) / 0.4;
                    t = Math.sin(t * Math.PI / 2);
                    cx = cx + (player.x - cx) * t;
                    let startCy = wTop + (sw * 0.65);
                    let targetCy = player.climbTargetY + sh / 2;
                    cy = startCy + (targetCy - startCy) * t;
                }
            } else {
                cy = wTop + (sw * 0.65);
            }
        }
    }

    let purupuruX = 0;
    let purupuruY = 0;
    if (isCalibrating) {
        let cycle = now - lastCalibrationSoundTime;
        if (cycle < 125) { 
            purupuruX = (Math.random() - 0.5) * 6;
            purupuruY = (Math.random() - 0.5) * 6;
        }
    }
    ctx.translate(cx + purupuruX, cy + purupuruY);

    if (player.confusionEndTime > now || player.bigFallPenaltyEndTime > now) {
        ctx.font = "16px 'DotGothic16', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let wobble = Math.sin(now / 50) * 5;
        let iconLocalX = (player.x - cx) + wobble;
        let iconLocalY = -sh - 16; 
        ctx.fillText("💫", iconLocalX, iconLocalY);
    }

    let isWallHit = hitStopEndTime > now && (player.wallHitDir === 1 || player.wallHitDir === -1) && !player.isClimbing;
    if (isWallHit || player.isClimbing) {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let localIconX = (player.wallHitDir === 1) ? -18 : 18;
        let localIconY = -sh - 5; 
        
        if (player.isClimbing) {
            let flash = Math.floor(now / 50) % 2 === 0;
            ctx.font = flash ? "28px 'DotGothic16', sans-serif" : "18px 'DotGothic16', sans-serif";
            ctx.globalAlpha = 1.0; 
            ctx.fillText("🖐️", localIconX, localIconY);
        } else {
            let isTiltedAway = (player.wallHitDir === 1 && tilt < 0) || (player.wallHitDir === -1 && tilt > 0);
            let iconStr = isTiltedAway ? "👟" : "🖐️";

            ctx.font = "20px 'DotGothic16', sans-serif";
            let bounce = Math.sin(now / 100) * 3;
            ctx.fillText(iconStr, localIconX, localIconY + bounce);
        }
    }

    let grad = ctx.createLinearGradient(0, -sh, 0, sh*0.5);
    grad.addColorStop(0, '#4fc3f7');
    grad.addColorStop(0.5, '#03a9f4');
    grad.addColorStop(1, '#0288d1');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#01579b';
    ctx.lineWidth = 2;

    if (player.isClimbing) {
        let ratio = (now - player.climbStartTime) / player.climbDuration;
        let wallAngle = (player.wallHitDir === 1) ? -Math.PI / 2 : Math.PI / 2;
        let groundAngle = pSlope;
        let climbAngle;
        
        if (ratio < 0.6) {
            climbAngle = wallAngle;
        } else {
            let t = (ratio - 0.6) / 0.4;
            t = Math.sin(t * Math.PI / 2); 
            climbAngle = wallAngle + (groundAngle - wallAngle) * t;
        }

        ctx.rotate(climbAngle);
        
        let tremble = isPressing ? (Math.random() - 0.5) * 3 : 0;
        drawSlime(ctx, sw, sh, isPressing, tremble, 0, tiltY);
        
    } else if (isLeftBonk || isRightBonk) {
        let pType = player.wallHitType;
        let bendMag = 0;
        if (pType === 1) bendMag = 0.3;         
        else if (pType === 2) bendMag = 1.0;    
        else bendMag = 0.6;                     

        let bend = (player.wallHitDir === 1) ? -bendMag : bendMag;
        let wallAngle = (player.wallHitDir === 1) ? -Math.PI / 2 : Math.PI / 2;
        ctx.rotate(wallAngle);

        drawSlime(ctx, sw, sh, false, 0, bend, tiltY);
        
    } else if (isCeilingBonk || isFloorBonk) {
        ctx.translate(0, -sh/2);
        let domeAngle = isCeilingBonk ? (Math.PI + pSlope) : pSlope;
        ctx.rotate(domeAngle);
        
        let r = sw * 0.7; 
        let flatY = sh * 0.5; 
        let domeY = -sh * 0.2; 

        ctx.beginPath();
        ctx.moveTo(-r, flatY);
        ctx.quadraticCurveTo(-r, domeY, 0, domeY);
        ctx.quadraticCurveTo(r, domeY, r, flatY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
    } else if (inAir) {
        let angle = Math.atan2(player.vy, player.vx);
        let stretch = Math.min(speed / 15, 1.0);
        ctx.translate(0, -sh/2);
        ctx.rotate(angle);
        
        let r = sh * 0.5;
        let frontStretch = 1 + stretch * 0.6; 
        let backStretch = 1 + stretch * 0.2;  
        let frontWidth = r * (1 + stretch * 0.4); 
        let backWidth = r * (1 - stretch * 0.1);  
        drawTeardrop(ctx, r, frontStretch, backStretch, frontWidth, backWidth);
        
    } else if (isCharging) {
        let tremble = (Math.random() - 0.5) * 3;
        let groundSlope = (player.currentPlatform && player.currentPlatform.slope) ? player.currentPlatform.slope * Math.PI / 180 : 0;
        ctx.rotate(groundSlope);
        
        if (Math.abs(player.vx) > 0.1) {
            let lean = -Math.min(Math.max(player.vx * 0.05, -0.4), 0.4); 
            ctx.transform(1, 0, lean, 1, 0, 0); 
        }
        
        drawSlime(ctx, sw, sh, true, tremble, 0, tiltY);
        
    } else {
        let groundSlope = (player.currentPlatform && player.currentPlatform.slope) ? player.currentPlatform.slope * Math.PI / 180 : 0;
        ctx.rotate(groundSlope);

        if (Math.abs(player.vx) > 0.1) {
            let lean = -Math.min(Math.max(player.vx * 0.05, -0.4), 0.4); 
            ctx.transform(1, 0, lean, 1, 0, 0); 
            let bounce = Math.sin(now / 50) * Math.min(Math.abs(player.vx) * 0.05, 0.2);
            ctx.scale(1.0 - bounce, 1.0 + bounce);
        }
        
        drawSlime(ctx, sw, sh, false, 0, 0, tiltY);
    }

    ctx.restore();

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.life--;
        ft.y -= 1;
        ctx.globalAlpha = ft.life / ft.maxLife;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 20px 'DotGothic16', sans-serif";
        ctx.textAlign = "center";
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 3;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    ctx.restore(); 
    requestAnimationFrame(update);
  }
</script>
